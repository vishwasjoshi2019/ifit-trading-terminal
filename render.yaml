services:
  - type: web
    name: ifit-trading-terminal
    env: docker
    plan: standard
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: TERMINAL_MODE
        value: QUANT
      - key: MARKET_FEED_PROVIDER
        value: SIMULATION
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
